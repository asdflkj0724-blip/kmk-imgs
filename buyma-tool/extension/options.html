<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ラク出品 設定</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin-top: 14px; }
    input[type=text], input[type=number], select, textarea { width: 100%; padding: 6px; box-sizing: border-box; font: inherit; }
    label input[type=checkbox] { width: auto; margin-right: 6px; }
    .hint { color: #666; font-size: 12px; margin: 2px 0 0; }
    .row { margin-top: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>ラク出品 設定</h1>

  <h2>ログイン</h2>
  <p id="auth">確認中…</p>
  <label for="apiBase">サーバーのURL</label>
  <input type="text" id="apiBase" placeholder="https://example.vercel.app">
  <p class="hint">管理画面のサイトのURL。開発中は http://localhost:3000</p>
  <div class="row">
    <button id="connect">ログインして連携する</button>
    <button id="logout" class="ghost">ログアウト</button>
  </div>

  <h2>配送方法</h2>
  <label for="shippingMethods">BUYMA に登録済みの配送方法（1行に1つ）</label>
  <textarea id="shippingMethods" rows="5" placeholder="BUYMA の配送方法の名前を、そのままコピーして貼り付けてください"></textarea>
  <p class="hint">名前は一言一句そのまま保存します。BUYMA の出品画面で選ぶ名前と同じにしてください。最後に選んだ配送方法は、変えるまで次の商品にも引き継ぎます。</p>

  <h2>透かし</h2>
  <label><input type="checkbox" id="watermarkEnabled"> 画像に透かしを入れる</label>
  <label for="watermarkText">透かしの文字</label>
  <input type="text" id="watermarkText" maxlength="40" placeholder="例：MAMC">
  <p class="hint">右下の少し内側に、薄いグレーで入れます。商品が見えるくらいの薄さです。画像 ZIP を作るときに入ります。</p>

  <h2>画像ZIP</h2>
  <label for="imageMaxPx">長い辺の最大ピクセル</label>
  <input type="number" id="imageMaxPx" min="300" max="4000" step="50">
  <label for="jpegQuality">JPEGの画質（0.1〜1）</label>
  <input type="number" id="jpegQuality" min="0.1" max="1" step="0.05">

  <div class="row">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>
  <script src="src/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
