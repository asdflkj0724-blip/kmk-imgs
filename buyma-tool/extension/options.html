<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BUYMA出品支援 設定</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin-top: 14px; }
    input[type=text], input[type=number], select { width: 100%; padding: 6px; box-sizing: border-box; }
    .hint { color: #666; font-size: 12px; margin: 2px 0 0; }
    .row { margin-top: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>BUYMA出品支援 設定</h1>

  <h2>ログイン</h2>
  <p id="auth">確認中…</p>
  <label for="apiBase">サーバーのURL</label>
  <input type="text" id="apiBase" placeholder="https://example.vercel.app">
  <p class="hint">管理画面のサイトのURL。開発中は http://localhost:3000</p>
  <div class="row">
    <button id="connect">ログインして連携する</button>
    <button id="logout" class="ghost">ログアウト</button>
  </div>

  <h2>BUYMAへの自動入力</h2>
  <label for="mode">動き方</label>
  <select id="mode">
    <option value="fill">入力だけ（保存は自分で押す）</option>
    <option value="draft">下書き保存まで自動</option>
  </select>
  <p class="hint">「下書き保存まで自動」は、BUYMAの規約で許されるか確かめてから使ってください。「出品する」「公開」のボタンは押しません。</p>
  <label for="intervalSec">1件ごとの間隔（秒）</label>
  <input type="number" id="intervalSec" min="30" step="5">
  <p class="hint">BUYMAに負担をかけないよう、30秒以上にしてください。</p>

  <h2>画像ZIP</h2>
  <label for="imageMaxPx">長い辺の最大ピクセル</label>
  <input type="number" id="imageMaxPx" min="300" max="4000" step="50">
  <label for="jpegQuality">JPEGの画質（0.1〜1）</label>
  <input type="number" id="jpegQuality" min="0.1" max="1" step="0.05">

  <div class="row">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>
  <script src="src/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
