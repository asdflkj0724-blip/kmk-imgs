<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>ラク出品</h1>
    <a href="#" id="openOptions" class="small">設定</a>
  </header>
  <p id="account" class="small muted">確認中…</p>

  <button id="extract">この商品の情報を取る</button>
  <p id="status"></p>

  <!-- 1. 読み取った内容の確認・修正（AI の抜き出しはたまに間違えるため） -->
  <section id="confirm" hidden>
    <h2>読み取った内容を確認してください</h2>
    <p class="small muted">間違っているところは直してから、下のボタンを押してください。</p>
    <ul id="warnings"></ul>
    <button id="vision" class="ghost" hidden>スクショで補う</button>

    <label for="fTitle">商品名（原文のままでOK）</label>
    <input type="text" id="fTitle">
    <label>価格</label>
    <div class="row3">
      <input type="number" id="fPriceMin" min="0" step="any" placeholder="いちばん安い値段" aria-label="最低価格">
      <input type="number" id="fPriceMax" min="0" step="any" placeholder="高い値段（あれば）" aria-label="最高価格">
      <select id="fCurrency" aria-label="通貨"></select>
    </div>
    <label for="fColors">色（1行に1つ）</label>
    <textarea id="fColors" rows="3"></textarea>
    <label for="fSizes">サイズ（1行に1つ）</label>
    <textarea id="fSizes" rows="3"></textarea>
    <label for="fSpecs">仕様（1行に「名前: 内容」）</label>
    <textarea id="fSpecs" rows="4"></textarea>
    <label>画像（違う画像はチェックを外す）<span id="imgcount" class="small muted"></span></label>
    <div id="images"></div>

    <label for="template">説明文のテンプレート</label>
    <select id="template"></select>
    <label for="instruction">追加の指示（なくてもよい）</label>
    <textarea id="instruction" rows="2" placeholder="例：通勤向けであることを強調して"></textarea>
    <button id="generate">この内容で出品データを作る</button>
  </section>

  <!-- 2. BUYMA の出品画面に貼る内容（半自動：登録はご自身で） -->
  <section id="listing" hidden>
    <h2>BUYMAに貼る内容</h2>
    <p class="note">BUYMAの出品画面に貼り付けて内容を確認し、最後の『出品する』はご自身で押してください。</p>
    <div id="fields"></div>
    <details id="breakdownBox"><summary>価格の内訳</summary><table id="breakdown"></table></details>
    <ul id="issues"></ul>
    <div class="actions">
      <button id="copyAll">全部まとめてコピー</button>
      <button id="saveListing" class="ghost">保存</button>
      <button id="markListed" class="ghost">BUYMAで出品済みにする</button>
    </div>
  </section>

  <div class="actions" id="tools" hidden>
    <button id="zip" class="ghost">画像ZIP</button>
    <button id="copy" class="ghost">JSONをコピー</button>
    <button id="save" class="ghost">JSONを保存</button>
  </div>

  <script src="src/api.js"></script>
  <script src="src/zip.js"></script>
  <script src="src/images.js"></script>
  <script src="src/page-reader.js"></script>
  <script src="src/product-form.js"></script>
  <script src="popup.js"></script>
</body>
</html>
