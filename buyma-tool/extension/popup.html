<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>BUYMA出品支援</h1>
    <a href="#" id="openOptions" class="small">設定</a>
  </header>
  <p id="account" class="small muted">確認中…</p>

  <button id="extract">この商品の情報を取る</button>
  <p id="status"></p>

  <section id="result" hidden>
    <h2 id="title"></h2>
    <p id="price"></p>
    <ul id="warnings"></ul>
    <button id="vision" class="ghost" hidden>スクショで補う</button>
    <details>
      <summary>取れた情報（SKU・仕様・画像）</summary>
      <h3>SKU</h3><div id="skus"></div>
      <h3>仕様</h3><table id="specs"></table>
      <h3>画像 <span id="imgcount"></span></h3><div id="images"></div>
    </details>

    <div id="genForm">
      <label for="template">説明文のテンプレート</label>
      <select id="template"></select>
      <label for="instruction">追加の指示（なくてもよい）</label>
      <textarea id="instruction" rows="2" placeholder="例：通勤向けであることを強調して"></textarea>
      <button id="generate">AIで出品データを作る</button>
    </div>

    <section id="listing" hidden>
      <h3>出品データ</h3>
      <label for="lTitle">商品名 <span id="titleCount" class="small"></span></label>
      <input type="text" id="lTitle">
      <label for="lDesc">商品コメント</label>
      <textarea id="lDesc" rows="8"></textarea>
      <label for="lPrice">販売価格（円）</label>
      <input type="number" id="lPrice" min="1" step="1">
      <details id="breakdownBox"><summary>価格の内訳</summary><table id="breakdown"></table></details>
      <p id="category" class="small muted"></p>
      <ul id="issues"></ul>
      <div class="actions">
        <button id="saveListing">保存</button>
        <button id="queueListing" class="ghost">出品待ちに入れる</button>
      </div>
    </section>

    <div class="actions">
      <button id="zip" class="ghost">画像ZIP</button>
      <button id="copy" class="ghost">JSONをコピー</button>
      <button id="save" class="ghost">JSONを保存</button>
    </div>
  </section>

  <section id="queueBox">
    <h3>BUYMAへの順番入力</h3>
    <div class="actions">
      <button id="queueStart" class="ghost">出品待ちを順番に入力</button>
      <button id="queueStop" class="ghost" hidden>止める</button>
    </div>
    <p id="queueStatus" class="small"></p>
    <ul id="queueLog" class="small muted"></ul>
  </section>

  <script src="src/api.js"></script>
  <script src="src/zip.js"></script>
  <script src="src/images.js"></script>
  <script src="popup.js"></script>
</body>
</html>
