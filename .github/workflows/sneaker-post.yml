name: Sneaker X Auto Post

on:
  schedule:
    # 日本時間 毎日20:00(UTC 11:00)
    - cron: '0 11 * * *'

  # 手動テスト用(dry_run=true で投稿せず文章だけ確認)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず文章の確認だけ行う'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sneaker-post
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy requests

      - name: Post sneaker to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/sneaker_post.py

      - name: Save post history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sneaker post history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
