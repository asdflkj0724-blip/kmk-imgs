# MAMC ブランド専用の自動投稿ワークフロー。
# 既存の「輝く未来教育」用ワークフロー（x-post.yml）とは完全に別物で、
# 使う Secrets・変数・商品リスト・画像フォルダ・投稿履歴もすべて分けてあります。
name: MAMC X Auto Post

on:
  schedule:
    # 日本時間 毎日20:00（UTC 11:00）。
    # ※GitHub Actions の仕様上、混雑状況によって実行が数分〜数十分
    #   遅れることがあります（指定時刻より早く実行されることはありません）。
    - cron: '0 11 * * *'

  # 手動テスト用（Actionsタブから実行できます）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行（実際には投稿しない）'
        type: boolean
        default: true
      verify_auth:
        description: 'X認証情報の確認だけを行う（投稿しない）'
        type: boolean
        default: false
      samples:
        description: '投稿せずに投稿内容を何パターン表示するか（確認用。空欄なら通常動作）'
        type: string
        default: ''
      brand_post:
        description: '商品が登録されていてもブランド紹介として投稿する'
        type: boolean
        default: false
      product_name:
        description: '投稿したい商品名（空欄なら自動で選びます）'
        type: string
        default: ''

permissions:
  contents: write

# 既存の x-post.yml（group: x-auto-post）とは別グループ。互いに影響しません。
concurrency:
  group: mamc-x-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ★自動投稿の安全スイッチ★
    # 準備ができるまで、毎日の自動実行は動きません。
    # 開始するときは Settings > Secrets and variables > Actions > Variables で
    # MAMC_POSTING_ENABLED = true を追加してください。
    # 手動実行（workflow_dispatch）は、この設定がなくてもテストできます。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MAMC_POSTING_ENABLED == 'true' }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install tweepy anthropic requests requests-oauthlib Pillow

      - name: 設定を点検
        env:
          MAMC_BUYMA_URL: ${{ vars.MAMC_BUYMA_URL }}
          MAMC_X_API_KEY: ${{ secrets.MAMC_X_API_KEY }}
          MAMC_X_API_SECRET: ${{ secrets.MAMC_X_API_SECRET }}
          MAMC_X_ACCESS_TOKEN: ${{ secrets.MAMC_X_ACCESS_TOKEN }}
          MAMC_X_ACCESS_TOKEN_SECRET: ${{ secrets.MAMC_X_ACCESS_TOKEN_SECRET }}
        run: python scripts/mamc_post_to_x.py --check || true

      # 認証情報だけを確認するモード。投稿は行いません。
      - name: X認証情報を確認（投稿しません）
        if: ${{ inputs.verify_auth == true }}
        env:
          MAMC_X_API_KEY: ${{ secrets.MAMC_X_API_KEY }}
          MAMC_X_API_SECRET: ${{ secrets.MAMC_X_API_SECRET }}
          MAMC_X_ACCESS_TOKEN: ${{ secrets.MAMC_X_ACCESS_TOKEN }}
          MAMC_X_ACCESS_TOKEN_SECRET: ${{ secrets.MAMC_X_ACCESS_TOKEN_SECRET }}
          MAMC_X_USERNAME: MAMC_JP
        run: python scripts/mamc_post_to_x.py --verify-auth

      - name: X（@MAMC_JP）へ投稿
        if: ${{ inputs.verify_auth != true }}
        env:
          # BUYMAショップURL（リポジトリ変数）。未設定なら投稿せず停止します。
          MAMC_BUYMA_URL: ${{ vars.MAMC_BUYMA_URL }}
          # MAMC専用の認証情報。既存システムの X_API_KEY などとは別の名前です。
          MAMC_X_API_KEY: ${{ secrets.MAMC_X_API_KEY }}
          MAMC_X_API_SECRET: ${{ secrets.MAMC_X_API_SECRET }}
          MAMC_X_ACCESS_TOKEN: ${{ secrets.MAMC_X_ACCESS_TOKEN }}
          MAMC_X_ACCESS_TOKEN_SECRET: ${{ secrets.MAMC_X_ACCESS_TOKEN_SECRET }}
          # 投稿先アカウントの確認用（違うアカウントなら投稿せず中止します）
          MAMC_X_USERNAME: MAMC_JP
          # 任意：登録されていれば Claude が毎回文章を書き分けます。
          # 未登録でも、テンプレートで文章が作られるので動きます。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRAND_POST: ${{ inputs.brand_post }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          ARGS=()
          if [ -n "$SAMPLES" ]; then ARGS+=(--samples "$SAMPLES"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$BRAND_POST" = "true" ]; then ARGS+=(--brand-post); fi
          if [ -n "$PRODUCT_NAME" ]; then ARGS+=(--product-name "$PRODUCT_NAME"); fi
          python scripts/mamc_post_to_x.py "${ARGS[@]}"

      - name: 投稿履歴を保存
        # 定期実行（schedule）では inputs が無いため、必ず履歴を保存する
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run != true && inputs.verify_auth != true && inputs.samples == '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamc_history.json
          if git diff --cached --quiet; then
            echo "履歴に変更はありません"
            exit 0
          fi
          git commit -m "MAMC投稿履歴を更新"
          for i in 1 2 3 4; do
            if git push origin HEAD; then exit 0; fi
            echo "push に失敗しました。少し待って再試行します..."
            sleep $((2 ** i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          git push origin HEAD
