# MAMC Instagram の反応（再生数・保存数・シェア数など）を毎日記録し、
# 毎週月曜に分析して、次週の企画の配分を更新するワークフロー。
# Instagram へは読み取りだけを行い、投稿はしません。X の自動投稿とは無関係です。
name: MAMC Instagram Insights

on:
  schedule:
    - cron: '50 18 * * *'   # 毎日 03:50 JST に反応を記録（月曜は週次分析も行う）

  workflow_dispatch:
    inputs:
      analyze:
        description: '週次分析も実行する（計画とレポートを更新）'
        type: boolean
        default: false

permissions:
  contents: write

# 投稿ワークフローと同じグループにして、履歴ファイルの保存がぶつからないようにする
concurrency:
  group: mamc-instagram-post
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 自動投稿の安全スイッチ（MAMC_IG_POSTING_ENABLED）が入るまで、毎日の自動実行は動きません
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MAMC_IG_POSTING_ENABLED == 'true' }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install requests

      - name: 反応を記録（読み取りのみ）
        env:
          MAMC_IG_ACCESS_TOKEN: ${{ secrets.MAMC_IG_ACCESS_TOKEN }}
          MAMC_IG_USER_ID: ${{ secrets.MAMC_IG_USER_ID }}
        run: python scripts/mamc_instagram_growth.py collect

      - name: 週次分析（月曜、または手動で指定したとき）
        if: ${{ always() }}
        env:
          ANALYZE: ${{ inputs.analyze }}
        run: |
          if [ "$ANALYZE" = "true" ] || [ "$(TZ=Asia/Tokyo date +%u)" = "1" ]; then
            python scripts/mamc_instagram_growth.py analyze
          else
            echo "今日は週次分析の日ではありません（毎週月曜に実行します）"
          fi

      - name: 記録・計画・レポートを保存
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamc_instagram_metrics.json mamc_instagram_plan.json mamc_instagram_reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -m "MAMC Instagramの反応を記録"
          for i in 1 2 3 4; do
            if git push origin HEAD; then exit 0; fi
            echo "push に失敗しました。少し待って再試行します..."
            sleep $((2 ** i))
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
          done
          git push origin HEAD
