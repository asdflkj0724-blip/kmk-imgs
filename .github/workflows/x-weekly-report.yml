name: X Weekly Report

on:
  schedule:
    # 日本時間 毎週日曜 8:17(UTC 土曜 23:17)。投稿の反応を集計して改善案を作る
    - cron: '17 23 * * 6'

  # 手動テスト用
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行(レポートを保存しない)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: x-weekly-report
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy anthropic

      - name: Build weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python scripts/weekly_report.py

      - name: Save report and metrics
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ history.json
          if ! git diff --cached --quiet; then
            git commit -m "週次レポートを更新"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD
          fi
