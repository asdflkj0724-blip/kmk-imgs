name: X Auto Post

on:
  schedule:
    # 日本時間 毎朝7:00(UTC 前日22:00)
    - cron: '0 22 * * *'

  # 手動テスト用
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行(実際には投稿しない)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: x-auto-post
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy anthropic

      - name: Generate and post to X
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python scripts/generate_and_post.py

      - name: Save post history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "投稿履歴を更新"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD
          fi
