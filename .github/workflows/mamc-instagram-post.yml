# MAMC の Instagram（@mamc_jp）自動投稿ワークフロー。
# 商品画像から11秒のリール動画を作り、毎日20:00（日本時間）に投稿します。
# X 用（mamc-x-post.yml）・教育用（x-post.yml）とは完全に別物で、
# Secrets・変数・投稿履歴も分けてあります（画像フォルダと文章ルールだけ共通）。
name: MAMC Instagram Auto Post

on:
  schedule:
    # 1日1回の「投稿枠」= 毎日 19:30 〜 翌日 19:30（日本時間）。1枠につき1回だけ投稿します。
    # 日本時間 19:40 に起動 → 動画を作って 20:00 まで待ってから投稿します。
    # GitHub Actions は混雑すると起動が数時間遅れることがあるため、予備の起動を入れています。
    # 予備は、その枠でまだ投稿されていない（遅延・失敗した）ときだけ投稿し、投稿済みなら
    # 数十秒で終わります。日付をまたいでも、枠のうちなら前日分として投稿します。
    - cron: '40 10 * * *'   # 19:40 JST（本番）
    - cron: '20 11 * * *'   # 20:20 JST（予備）
    - cron: '20 12 * * *'   # 21:20 JST（予備）
    - cron: '20 14 * * *'   # 23:20 JST（予備）
    - cron: '20 17 * * *'   # 02:20 JST（予備）
    - cron: '20 21 * * *'   # 06:20 JST（予備）
    - cron: '20 2 * * *'    # 11:20 JST（予備）
    - cron: '20 6 * * *'    # 15:20 JST（予備）

  # 手動テスト用（Actionsタブから実行できます）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行（実際には投稿しない・動画はダウンロードして確認できます）'
        type: boolean
        default: true
      verify_auth:
        description: 'トークンと権限の確認だけを行う（投稿しない）'
        type: boolean
        default: false
      format:
        description: '投稿形式（reel = 11秒のリール動画 / image = 画像1枚）'
        type: choice
        options: [reel, image]
        default: reel
      source:
        description: '内容の決め方（auto = Xの投稿を使う・無ければ新規 / x = Xの投稿のみ / new = 新規作成）'
        type: choice
        options: [auto, x, new]
        default: auto
      force_post:
        description: '本番投稿のとき、今日すでに投稿済みでも投稿する（直前30分以内の投稿があれば中止）'
        type: boolean
        default: false
      samples:
        description: '3種類（比較・デザイン紹介・広告風）のサンプル動画を作る（投稿しない）'
        type: boolean
        default: false
      template:
        description: '動画の種類（auto = 計画にしたがって選ぶ / compare = コーデ比較 / detail = デザイン紹介 / ad = 広告風）'
        type: choice
        options: [auto, compare, detail, ad]
        default: auto
      duration:
        description: '動画の長さ（11秒）'
        type: choice
        options: [auto, '11']
        default: auto

permissions:
  contents: write

concurrency:
  group: mamc-instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # ★自動投稿の安全スイッチ★
    # 準備ができるまで、毎日の自動実行は動きません。
    # 開始するときは Settings > Secrets and variables > Actions > Variables で
    # MAMC_IG_POSTING_ENABLED = true を追加してください。
    # 手動実行（workflow_dispatch）は、この設定がなくてもテストできます。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MAMC_IG_POSTING_ENABLED == 'true' }}

    env:
      FORMAT: ${{ inputs.format || vars.MAMC_IG_FORMAT || 'reel' }}
      IS_REAL_POST: ${{ github.event_name == 'schedule' || (inputs.dry_run != true && inputs.verify_auth != true && inputs.samples != true) }}

    steps:
      # 本番投稿・定期実行は、最新の履歴を使うため既定ブランチ（main）の最新を取得する。
      # テスト実行・サンプル作成（投稿しない）だけは、実行したブランチのコードを使う
      # （PR のブランチで、マージ前に新しい動画を試せるようにするため）
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (inputs.samples || inputs.dry_run)) && github.ref || github.event.repository.default_branch }}

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 定期実行では、この投稿枠で投稿済みなら以降の重い処理をすべて省略します
      - name: この投稿枠で投稿済みか確認
        id: status
        if: ${{ github.event_name == 'schedule' }}
        run: python scripts/mamc_post_to_instagram.py --status

      # 一度ダウンロードした ffmpeg・フォントの .deb を保存しておき、次回からはネットに出ずに入れる
      # （apt のミラーが止まっても投稿できるように）。ランナーの OS イメージが変わったら作り直す。
      - name: ランナーの OS イメージを確認
        id: image
        if: ${{ steps.status.outputs.done != 'true' }}
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 保存済みの ffmpeg・フォントを読み込む
        id: debcache
        if: ${{ steps.status.outputs.done != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/mamc-debs
          key: mamc-debs-${{ steps.image.outputs.version }}-v1

      # apt はミラーの不調で応答が止まることがあるため、通信・ロック待ち・1回ごとの処理に時間の上限を付け、
      # 最大3回までやり直す（3回目は別のミラーに切り替える）。すでに入っているものは入れ直さない。
      - name: 必要なライブラリをインストール
        if: ${{ steps.status.outputs.done != 'true' }}
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DEBS="$HOME/mamc-debs"
          mkdir -p "$DEBS/partial"
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                    -o DPkg::Lock::Timeout=120 -o Dpkg::Use-Pty=0
                    -o Dir::Cache::Archives="$DEBS" -o APT::Keep-Downloaded-Packages=true)
          have_ffmpeg() {
            local enc
            enc=$(ffmpeg -hide_banner -encoders 2>/dev/null || true)   # grep -q と pipefail の組み合わせを避ける
            command -v ffprobe >/dev/null && [[ "$enc" == *" libx264 "* ]]
          }
          have_font() {
            [ -e /usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc ] || [ -e /usr/share/fonts/noto-cjk/NotoSerifCJK-Bold.ttc ]
          }
          missing() {
            need=()
            have_ffmpeg || need+=(ffmpeg)
            have_font || need+=(fonts-noto-cjk)
          }
          missing
          # 保存済みの .deb があれば、ネットに出ずに入れる
          if [ ${#need[@]} -gt 0 ] && compgen -G "$DEBS/*.deb" >/dev/null; then
            echo "::group::保存済みの .deb からインストール（$(ls "$DEBS"/*.deb | wc -l) 個）"
            sudo -E timeout 300 dpkg -i "$DEBS"/*.deb || echo "::warning::保存済みの .deb から入れられませんでした。apt で入れます"
            echo "::endgroup::"
            missing
          fi
          if [ ${#need[@]} -eq 0 ]; then
            echo "ffmpeg: $(ffmpeg -version | head -n1)"
            echo "日本語フォント（Noto Serif CJK）: インストール済み"
          else
            echo "apt でインストールします: ${need[*]}"
            ok=false
            for i in 1 2 3; do
              echo "::group::apt 試行 $i/3"
              if [ "$i" -eq 1 ]; then
                # 1回目は、手元のパッケージ一覧のまま入れてみる（止まりやすい update を省ける）
                sudo -E timeout 150 apt-get install -y -q --no-install-recommends "${APT_OPTS[@]}" "${need[@]}" && ok=true
              else
                if [ "$i" -eq 3 ]; then
                  # 3回目は、Ubuntu 公式のミラーに切り替える（いつものミラーが止まっているとき用）
                  echo "ミラーを archive.ubuntu.com に切り替えます"
                  sudo sed -i -E 's#https?://[^ /]*(archive|mirror)[^ /]*/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' \
                    /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
                fi
                sudo -E timeout 120 apt-get update -q "${APT_OPTS[@]}" \
                  && sudo -E timeout 240 apt-get install -y -q --no-install-recommends "${APT_OPTS[@]}" "${need[@]}" \
                  && ok=true
              fi
              echo "::endgroup::"
              if [ "$ok" = true ] || [ "$i" -eq 3 ]; then break; fi
              echo "::warning::apt に失敗しました（試行 $i/3）。$((i * 15)) 秒後にやり直します"
              sleep $((i * 15))
            done
            missing
            if [ "$ok" != true ] || [ ${#need[@]} -gt 0 ]; then
              echo "::error::ffmpeg・日本語フォントをインストールできませんでした（3回失敗）"
              exit 1
            fi
            sudo chown -R "$USER" "$DEBS"
            echo "NEW_DEBS=true" >> "$GITHUB_ENV"
          fi
          timeout 300 pip install --progress-bar off --retries 3 --timeout 60 requests Pillow numpy anthropic

      # 新しくダウンロードした .deb を保存する（次回から apt のミラーを使わずに済む）
      - name: ffmpeg・フォントの .deb を保存
        if: ${{ env.NEW_DEBS == 'true' && steps.debcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/mamc-debs
          key: ${{ steps.debcache.outputs.cache-primary-key }}

      # 本番投稿の前に、動画づくりに必要なもの（ffmpeg の H.264・AAC、明朝体フォント、ライブラリ）を確かめる
      - name: 必要なものがそろっているか確認
        if: ${{ steps.status.outputs.done != 'true' && inputs.verify_auth != true }}
        timeout-minutes: 3
        run: python scripts/mamc_check_deps.py

      - name: トークンと権限を確認（投稿しません）
        if: ${{ inputs.verify_auth == true }}
        env:
          MAMC_IG_ACCESS_TOKEN: ${{ secrets.MAMC_IG_ACCESS_TOKEN }}
          MAMC_IG_USER_ID: ${{ secrets.MAMC_IG_USER_ID }}
        run: python scripts/mamc_post_to_instagram.py --verify-auth

      # 画像1枚の投稿のときだけ必要（Instagram の縦横比に合わせた画像を公開URLにする）
      - name: Instagram用の画像を準備
        if: ${{ env.FORMAT == 'image' && env.IS_REAL_POST == 'true' && steps.status.outputs.done != 'true' }}
        run: |
          python scripts/mamc_post_to_instagram.py --prepare-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamc_images_instagram
          if ! git diff --cached --quiet; then
            git commit -m "MAMC Instagram用画像を追加"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin HEAD
          fi

      - name: Instagram（@mamc_jp）へ投稿
        if: ${{ inputs.verify_auth != true && steps.status.outputs.done != 'true' }}
        env:
          MAMC_IG_ACCESS_TOKEN: ${{ secrets.MAMC_IG_ACCESS_TOKEN }}
          MAMC_IG_USER_ID: ${{ secrets.MAMC_IG_USER_ID }}
          # 任意：Xの投稿が無い日に新しく文章を作るとき、Claude で書き分けます
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE: ${{ inputs.source || 'auto' }}
          FORCE_POST: ${{ inputs.force_post }}
          SAMPLES: ${{ inputs.samples }}
          TEMPLATE: ${{ inputs.template || 'auto' }}
          DURATION: ${{ inputs.duration || 'auto' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$SAMPLES" = "true" ]; then
            # 3種類のサンプル動画を作るだけ（投稿・履歴の更新はしない）
            python scripts/mamc_post_to_instagram.py --samples --source "$SOURCE" \
              --duration "$DURATION" --video-out "$RUNNER_TEMP/mamc_reels"
            exit 0
          fi
          ARGS=(--format "$FORMAT" --source "$SOURCE" --template "$TEMPLATE" --duration "$DURATION"
                --video-out "$RUNNER_TEMP/mamc_reel.mp4")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$EVENT" = "schedule" ]; then ARGS+=(--scheduled); fi
          if [ "$FORCE_POST" = "true" ]; then ARGS+=(--force-post); fi
          python scripts/mamc_post_to_instagram.py "${ARGS[@]}"

      - name: 作成した動画を保存（Actions の画面からダウンロードできます）
        if: ${{ always() && inputs.verify_auth != true && env.FORMAT == 'reel' && steps.status.outputs.done != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mamc-reel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mamc_reel.mp4
            ${{ runner.temp }}/mamc_reels/
          if-no-files-found: ignore
          retention-days: 14

      - name: 投稿履歴・失敗ログを保存
        # 失敗したときも原因を残すため always() で実行する
        if: ${{ always() && env.IS_REAL_POST == 'true' && steps.status.outputs.done != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamc_instagram_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "履歴に変更はありません"
            exit 0
          fi
          git commit -m "MAMC Instagram投稿履歴を更新"
          for i in 1 2 3 4; do
            if git push origin HEAD; then exit 0; fi
            echo "push に失敗しました。少し待って再試行します..."
            sleep $((2 ** i))
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
          done
          git push origin HEAD
