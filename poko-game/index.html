<meta charset="utf-8">
<title>ポコのぼうけん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* layout: one centered arcade-cabinet column — toolbar, 4:3 screen, then touch pad or key help */
:root{
  --bg:#17142a; --cab:#241f3d; --edge:#3a3260; --fg:#f5efe0; --muted:#a49cc6; --accent:#ffcc3a; --red:#ff5a4f;
  --font-ui:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;
  -webkit-user-select:none;user-select:none}
.top{width:min(100%,880px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:400;letter-spacing:.06em;text-wrap:balance}
.tools{display:flex;gap:6px}
.tools button{font:inherit;font-size:13px;background:var(--cab);color:var(--fg);border:1px solid var(--edge);border-radius:6px;padding:6px 10px;cursor:pointer}
.screen{width:min(100%,880px,calc((100dvh - 120px) * 4 / 3));aspect-ratio:4/3;max-width:100%;border:4px solid var(--edge);border-radius:6px;background:#000;box-sizing:border-box;flex:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.help{color:var(--muted);font-size:14px;text-align:center;line-height:1.9;max-width:60ch}
kbd{font-family:var(--font-px);font-size:9px;background:var(--cab);border:1px solid var(--edge);border-radius:4px;padding:2px 5px;color:var(--fg)}
.pad{display:none;width:min(100%,520px);justify-content:space-between;align-items:center;touch-action:none;gap:12px}
.pad button{touch-action:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-px);color:var(--fg);border:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad{display:flex;gap:10px}
.dpad button{width:70px;height:64px;border-radius:12px;background:var(--cab);box-shadow:inset 0 -4px 0 var(--edge);font-size:18px}
.ab{display:flex;gap:14px;align-items:flex-end}
.ab button{width:70px;height:70px;border-radius:50%;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ab .a{background:var(--red);box-shadow:inset 0 -4px 0 #a8302a;margin-bottom:24px}
.ab .b{background:#d99a2b;box-shadow:inset 0 -4px 0 #8f6212}
.ab small{font-family:var(--font-ui);font-size:10px}
.pad button.on{transform:translateY(2px);filter:brightness(1.25)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){
  .pad{display:flex}
  .help.keys{display:none}
  .screen{width:min(100%,880px,calc((100dvh - 230px) * 4 / 3))}
}
</style>

<div class="top">
  <h1>ポコのぼうけん</h1>
  <div class="tools">
    <button id="btnPause" type="button">一時停止</button>
    <button id="btnMute" type="button">音: ON</button>
  </div>
</div>
<div class="screen"><canvas id="game" width="320" height="240" aria-label="ゲーム画面"></canvas></div>
<div class="pad" id="pad">
  <div class="dpad">
    <button type="button" data-key="left" aria-label="左">◀</button>
    <button type="button" data-key="right" aria-label="右">▶</button>
  </div>
  <div class="ab">
    <button type="button" class="b" data-key="run">B<small>ダッシュ</small></button>
    <button type="button" class="a" data-key="jump">A<small>ジャンプ</small></button>
  </div>
</div>
<p class="help keys">
  <kbd>←</kbd><kbd>→</kbd> 移動　<kbd>Z</kbd>/<kbd>SPACE</kbd>/<kbd>↑</kbd> ジャンプ（長押しで高く）　<kbd>X</kbd>/<kbd>SHIFT</kbd> ダッシュ<br>
  <kbd>ENTER</kbd> スタート　<kbd>P</kbd> 一時停止　<kbd>M</kbd> 音のON/OFF<br>
  ★ブロックを下からたたこう。ベリーで大きくなり、クローバーで1UP。ゴールの旗をめざせ！
</p>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const T = 16, W = 320, H = 240, ROWS = 15, DT = 1000 / 60;
ctx.imageSmoothingEnabled = false;

/* ================= INPUT ================= */
const keys = { left:false, right:false, jump:false, run:false };
let jumpPressed = false, startPressed = false;
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', KeyX:'run', ShiftLeft:'run', ShiftRight:'run' };
addEventListener('keydown', e => {
  initAudio();
  const k = KEYMAP[e.code];
  if (k) { if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; e.preventDefault(); }
  if (e.repeat) return;
  if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ') startPressed = true;
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('[data-key]').forEach(b => {
  const k = b.dataset.key;
  const down = e => { e.preventDefault(); initAudio(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; startPressed = true; b.classList.add('on'); };
  const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => { initAudio(); startPressed = true; });
document.getElementById('btnMute').addEventListener('click', () => { initAudio(); toggleMute(); });
document.getElementById('btnPause').addEventListener('click', () => togglePause());

/* ================= AUDIO ================= */
let actx = null, master = null, muted = false, music = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
    if (pendingSong) { playMusic(pendingSong); }
  } catch (_) { actx = null; }
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.5;
  document.getElementById('btnMute').textContent = muted ? '音: OFF' : '音: ON';
}
function togglePause() {
  if (G.state !== 'play') return;
  G.paused = !G.paused;
  document.getElementById('btnPause').textContent = G.paused ? '再開' : '一時停止';
  if (G.paused) stopMusic(); else playMusic(THEMES[L.theme].music);
}
const NAMES = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function midi(s) { let n = NAMES[s[0]], i = 1; if (s[1] === '#') { n++; i = 2; } else if (s[1] === 'b') { n--; i = 2; } return 12 * (parseInt(s.slice(i), 10) + 1) + n; }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function noteAt(freq, t, dur, type, vol, freqEnd) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function sweep(f1, f2, dur, type, vol) { if (actx) noteAt(f1, actx.currentTime, dur, type, vol, f2); }
function seq(list, type, vol, delay) {
  if (!actx) return;
  let t = actx.currentTime + (delay || 0);
  for (const [n, d] of list) { if (n) noteAt(hz(midi(n)), t, d * 0.95, type, vol); t += d; }
}
function noise(dur, vol) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = vol;
  s.buffer = buf; s.connect(g); g.connect(master); s.start();
}
const sfx = {
  jump(){ sweep(260, 640, 0.17, 'square', 0.12); },
  coin(){ seq([['E6',0.05],['G#6',0.22]], 'square', 0.1); },
  stomp(){ sweep(520, 140, 0.11, 'square', 0.16); },
  bump(){ sweep(150, 80, 0.09, 'triangle', 0.4); },
  brk(){ noise(0.2, 0.35); },
  appear(){ sweep(240, 820, 0.35, 'square', 0.09); },
  power(){ seq([['C5',.05],['G5',.05],['C6',.05],['D5',.05],['A5',.05],['D6',.05],['E5',.05],['B5',.05],['E6',.12]], 'square', 0.11); },
  hurt(){ sweep(720, 170, 0.4, 'square', 0.12); },
  die(){ seq([['G5',.1],['F#5',.1],['F5',.1],['E5',.15],['C5',.15],['A4',.18],['F4',.45]], 'square', 0.13); },
  oneup(){ seq([['C6',.07],['E6',.07],['G6',.07],['C7',.22]], 'square', 0.11); },
  kick(){ sweep(300, 650, 0.09, 'square', 0.13); },
  flag(){ sweep(1000, 200, 0.9, 'square', 0.08); },
  clear(){ seq([['C5',.13],['E5',.13],['G5',.13],['C6',.26],['A5',.13],['B5',.13],['C6',.6]], 'square', 0.13);
           seq([['C3',.39],['F3',.26],['G3',.26],['C3',.6]], 'triangle', 0.25); },
  tick(){ sweep(1400, 1400, 0.03, 'square', 0.05); },
  over(){ seq([['E5',.22],['C5',.22],['A4',.22],['F4',.32],['E4',.32],['D4',.7]], 'triangle', 0.3); },
  ending(){ seq([['G4',.15],['C5',.15],['E5',.15],['G5',.3],['E5',.15],['G5',.15],['C6',.8]], 'square', 0.12);
            seq([['C3',.45],['G3',.45],['C4',.8]], 'triangle', 0.25); },
  hurry(){ seq([['C6',.07],['C6',.07],['E6',.07],['E6',.07],['G6',.07],['G6',.07]], 'square', 0.08); },
};
// Original background tunes. Tokens are eighth notes: '-' holds, '.' rests.
const tok = s => s.split(/\s+/).filter(t => t && t !== '|');
const SONGS = {
  field: { bpm: 144,
    lead: tok(`C5 - E5 G5 - E5 A5 - | G5 - E5 - D5 - C5 - | D5 - F5 A5 - F5 B5 - | A5 - G5 - - - . . |
               C5 - E5 G5 - E5 C6 - | B5 - A5 - G5 - E5 - | F5 - E5 - D5 - B4 - | C5 - - - . . . .`),
    bass: tok(`C3 . G3 . C3 . G3 . | C3 . G3 . C3 . G3 . | D3 . A3 . D3 . A3 . | G2 . D3 . G2 . B2 . |
               C3 . G3 . C3 . G3 . | E3 . B3 . E3 . B3 . | F3 . C4 . G2 . D3 . | C3 . G3 . C3 . . .`) },
  cave: { bpm: 112,
    lead: tok(`A4 . C5 . E5 . D5 . | C5 . B4 . A4 - - . | G4 . B4 . D5 . C5 . | B4 . G4 . E4 - - . |
               A4 . C5 . E5 . A5 . | G5 . E5 . C5 . D5 . | E5 . D5 . C5 . B4 . | A4 - - - . . . .`),
    bass: tok(`A2 . A2 . E3 . A2 . | F2 . F2 . C3 . F2 . | G2 . G2 . D3 . G2 . | E2 . E2 . B2 . E2 . |
               A2 . A2 . E3 . A2 . | C3 . C3 . G3 . C3 . | D3 . D3 . E3 . E3 . | A2 . E3 . A2 . . .`) },
};
SONGS.sky = { bpm: 164, lead: SONGS.field.lead, bass: SONGS.field.bass };
let pendingSong = null;
function playMusic(name) {
  pendingSong = name;
  if (!actx) return;
  music = { song: SONGS[name], step: 0, next: actx.currentTime + 0.08 };
}
function stopMusic() { music = null; pendingSong = null; }
function voice(arr, i, t, step, type, vol) {
  const n = arr[i % arr.length];
  if (!n || n === '.' || n === '-') return;
  let len = 1; while (len < 8 && arr[(i + len) % arr.length] === '-') len++;
  noteAt(hz(midi(n)), t, len * step * 0.92, type, vol);
}
function musicTick() {
  if (!music || !actx) return;
  const s = music.song, step = 60 / s.bpm / 2;
  while (music.next < actx.currentTime + 0.15) {
    voice(s.lead, music.step, music.next, step, 'square', 0.06);
    voice(s.bass, music.step, music.next, step, 'triangle', 0.16);
    music.next += step; music.step++;
  }
}

/* ================= SPRITES ================= */
const PAL = { k:'#2a1b2e', g:'#3fa34d', G:'#9be488', s:'#ffd0a1', w:'#ffffff', e:'#2a1b2e', r:'#ff8f8f',
  y:'#f6b93b', b:'#7a4a2b', C:'#6b3e1f', c:'#a8693a', a:'#e3ab6a', f:'#3a2414' };
const HEAD = [
  '.....kkkkkk.....', '...kkggggggkk...', '..kggggggggggk..', '.kgggGGggggggk..', '.kgggggkkkkkkkk.',
  '.kgggkssssssssk.', '.kggksssssswesk.', '.kggksssssswesk.', '.kgggkssrssssk..', '..kggkkkkkkkk...' ];
const SB = ['...kyyyyyyyk....', '..ksyyyyyyysk...', '...kyybbbyyk....', '...kyyyyyyyk....'];
const SL = { S:['...kbbk.kbbk....','..kbbbk.kbbbk...'], W1:['..kbbk...kbbk...','.kbbbk....kbbk..'], W2:['....kbbkbbk.....','....kbbbbbbk....'] };
const BB = ['...kyyyyyyyk....', '..kyyyyyyyyyk...', '.ksyyyyyyyyysk..', '.ksyyyyyyyyysk..', '.kskyyyyyyyksk..',
  '..kkybbbbbykk...', '...kyyyyyyyk....', '...kyyyyyyyk....', '...kyyykyyyk....', '...kbbbkbbbk....'];
const BL = { S:['...kbbk.kbbk....','...kbbk.kbbk....','..kbbbk.kbbbk...','..kkkkk.kkkkk...'],
  W1:['...kbbk..kbbk...','..kbbk....kbbk..','.kbbbk....kbbbk.','.kkkkk....kkkkk.'],
  W2:['....kbbkbbk.....','....kbbkbbk.....','....kbbbbbbk....','....kkkkkkkk....'] };
const ACORN = ['................','......kkkk......','....kkCCCCkk....','...kCcCcCcCCk...','..kCCCCCCCCCCk..',
  '..kkkkkkkkkkkk..','..kaaaaaaaaaak..','..kawkaaaakwak..','..kawkaaaakwak..','..kaaaaaaaaaak..',
  '..kaaakkkkaaak..','...kaaaaaaaak...','....kaaaaaak....','.....kkkkkk.....'];
const SPR = {
  sS: [...HEAD, ...SB, ...SL.S], sW1: [...HEAD, ...SB, ...SL.W1], sW2: [...HEAD, ...SB, ...SL.W2], sJ: [...HEAD, ...SB, ...SL.W1],
  bS: [...HEAD, ...BB, ...BL.S], bW1: [...HEAD, ...BB, ...BL.W1], bW2: [...HEAD, ...BB, ...BL.W2], bJ: [...HEAD, ...BB, ...BL.W1],
  w1: [...ACORN, '...kfk....kfk...', '...kkk....kkk...'],
  w2: [...ACORN, '....kfk..kfk....', '....kkk..kkk....'],
};
const cache = {};
function pixSprite(rows, flip) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue;
    x.fillStyle = PAL[ch]; x.fillRect(flip ? r.length - 1 - i : i, j, 1, 1); } });
  return c;
}
function S(name, flip) { const k = name + (flip ? '<' : ''); return cache[k] || (cache[k] = pixSprite(SPR[name], flip)); }
function drawnSprite(name, fn) {
  if (cache[name]) return cache[name];
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const x = c.getContext('2d'); const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  fn(R); return (cache[name] = c);
}
const spiky = f => drawnSprite('spiky' + f, R => {
  for (const sx of [2, 5, 8, 11]) { R(sx + 1, 1, 1, 2, '#fff1d0'); R(sx, 3, 3, 2, '#fff1d0'); }
  R(4, 5, 8, 1, '#7b4fd0'); R(3, 6, 10, 7, '#7b4fd0'); R(2, 8, 12, 4, '#7b4fd0'); R(3, 12, 10, 2, '#53309c');
  R(5, 8, 2, 2, '#fff'); R(9, 8, 2, 2, '#fff'); R(6, 9, 1, 1, '#2a1b2e'); R(9, 9, 1, 1, '#2a1b2e');
  if (f) { R(3, 14, 3, 2, '#2a1b2e'); R(10, 14, 3, 2, '#2a1b2e'); } else { R(4, 14, 3, 2, '#2a1b2e'); R(9, 14, 3, 2, '#2a1b2e'); }
});
const berry = () => drawnSprite('berry', R => {
  R(5, 4, 6, 11, '#2a1b2e'); R(3, 6, 10, 7, '#2a1b2e'); R(4, 5, 8, 9, '#2a1b2e');
  R(5, 5, 6, 9, '#ff4d6d'); R(4, 6, 8, 7, '#ff4d6d'); R(6, 4 + 1, 4, 1, '#ff4d6d');
  R(5, 6, 2, 2, '#ffd0da'); R(8, 9, 1, 1, '#ffe08a'); R(10, 7, 1, 1, '#ffe08a'); R(6, 11, 1, 1, '#ffe08a'); R(9, 12, 1, 1, '#ffe08a');
  R(7, 1, 2, 4, '#2f7a33'); R(9, 2, 3, 2, '#3fa34d'); R(4, 2, 3, 2, '#3fa34d');
});
const clover = () => drawnSprite('clover', R => {
  const g = '#4cc25a', d = '#2a7a35', l = '#b8f0a8';
  for (const [a, b] of [[2, 2], [9, 2], [2, 8], [9, 8]]) { R(a, b + 1, 5, 3, d); R(a + 1, b, 3, 5, d); R(a + 1, b + 1, 3, 3, g); }
  R(6, 5, 4, 5, g); R(3, 3, 1, 1, l); R(10, 3, 1, 1, l); R(7, 11, 2, 5, d);
});

/* ================= THEMES & STAGES ================= */
const THEMES = {
  grass: { sky:'#86cdf2', sky2:'#d4f0fb', hill:'#7fcf8c', hill2:'#5fb37a', dirt:'#c97b40', dirtD:'#8e4f24', top:'#5cc04a', topD:'#2f8a2c',
           brick:'#c8562f', brickH:'#ee8a5e', mortar:'#5c2210', music:'field' },
  cave:  { sky:'#10142a', sky2:'#202a55', hill:'#232d5a', hill2:'#2c3870', dirt:'#4b5c92', dirtD:'#2f3b66', top:'#8ea2dc', topD:'#3a4a80',
           brick:'#5a6fb8', brickH:'#8aa0e6', mortar:'#1a2246', music:'cave' },
  sky:   { sky:'#4b3f98', sky2:'#ffb07a', hill:'#8a6fb8', hill2:'#a585c6', dirt:'#a8704a', dirtD:'#6e4026', top:'#86d46a', topD:'#3f8f3a',
           brick:'#c8562f', brickH:'#ee8a5e', mortar:'#5c2210', music:'sky' },
};
const SOLID = new Set(['#', 'B', 'Q', 'P', 'L', 'M', 'U', 'X', 'T']);
function mk(w, theme, name, time) {
  const map = []; for (let y = 0; y < ROWS; y++) map.push(new Array(w).fill('.'));
  const L = { w, theme, name, time, map, ents: [], start: { x: 2, y: 12 }, goalX: 0, mc: {} };
  L.set = (x, y, c) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) map[y][x] = c; };
  L.fill = (x1, x2, y1, y2, c) => { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) L.set(x, y, c); };
  L.ground = (x1, x2) => L.fill(x1, x2, 13, 14, '#');
  L.plat = (x1, x2, top) => L.fill(x1, x2, top, 14, '#');
  L.row = (x, y, s) => { [...s].forEach((c, i) => { if (c !== ' ') L.set(x + i, y, c); }); };
  L.stump = (x, h) => L.fill(x, x + 1, 13 - h, 12, 'T');
  L.up = (x, n, base = 12) => { for (let i = 0; i < n; i++) L.fill(x + i, x + i, base - i, base, 'X'); };
  L.down = (x, n, base = 12) => { for (let i = 0; i < n; i++) L.fill(x + i, x + i, base - (n - 1 - i), base, 'X'); };
  L.e = (x, y, t) => L.ents.push({ x, y, t });
  L.goal = x => { L.goalX = x; L.set(x, 12, 'X'); };
  return L;
}
const STAGES = [
  () => { // 1-1 grassland
    const L = mk(212, 'grass', 'はじまりの そうげん', 300);
    L.ground(0, 68); L.ground(71, 86); L.ground(90, 151); L.ground(154, 211);
    L.row(16, 9, 'Q'); L.row(20, 9, 'BPBQB'); L.row(22, 5, 'Q'); L.e(25, 12, 'w');
    L.stump(29, 2); L.row(29, 8, 'oo');

/* ================= GAME STATE ================= */
const G = { state:'title', stage:0, score:0, coins:0, lives:3, time:300, tacc:0, t:0, frame:0, hi:0, paused:false,
  flagY:0, phase:0 };
let L = null, P = null, ents = [], items = [], fx = [], pops = [], bumps = [], camX = 0;
try { G.hi = parseInt(localStorage.getItem('poko-hi') || '0', 10) || 0; } catch (_) {}
function saveHi() { if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('poko-hi', String(G.hi)); } catch (_) {} } }

function loadStage(i, keepBig) {
  L = STAGES[i]();
  ents = L.ents.map(e => ({ type: e.t, x: e.x * T + 1, y: e.y * T + 2, w: 14, h: 14, vx: e.t === 's' ? -0.4 : -0.5, vy: 0, st: 'idle', t: 0 }));
  items = []; fx = []; pops = []; bumps = []; camX = 0;
  G.time = L.time; G.tacc = 0; G.flagY = 2 * T + 8; G.phase = 0;
  P = { x: L.start.x * T + 2, y: 0, w: 12, h: 14, vx: 0, vy: 0, big: false, face: 1, onGround: false, anim: 0,
        inv: 0, growT: 0, dead: false, combo: 0, jbuf: 0, coyote: 0, hidden: false };
  if (keepBig) { P.big = true; P.h = 22; }
  P.y = (L.start.y + 1) * T - P.h;
}
function newGame() { G.score = 0; G.coins = 0; G.lives = 3; G.stage = 0; startIntro(false); }
function startIntro(keepBig) { loadStage(G.stage, keepBig); G.state = 'intro'; G.t = 0; G.paused = false; stopMusic(); }

/* ---------- tiles & collision ---------- */
function tileAt(tx, ty) { if (tx < 0 || tx >= L.w || ty < 0 || ty >= ROWS) return '.'; return L.map[ty][tx]; }
function solidAt(tx, ty) { if (tx < 0 || tx >= L.w) return true; if (ty < 0 || ty >= ROWS) return false; return SOLID.has(L.map[ty][tx]); }
function collideX(o) {
  const y1 = Math.floor(o.y / T), y2 = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) { const tx = Math.floor((o.x + o.w - 0.01) / T); for (let ty = y1; ty <= y2; ty++) if (solidAt(tx, ty)) { o.x = tx * T - o.w; return true; } }
  else if (o.vx < 0) { const tx = Math.floor(o.x / T); for (let ty = y1; ty <= y2; ty++) if (solidAt(tx, ty)) { o.x = (tx + 1) * T; return true; } }
  return false;
}
function collideY(o, isPlayer) {
  o.onGround = false;
  const x1 = Math.floor(o.x / T), x2 = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = x1; tx <= x2; tx++) if (solidAt(tx, ty)) { o.y = ty * T - o.h; o.vy = 0; o.onGround = true; return null; }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T), hits = [];
    for (let tx = x1; tx <= x2; tx++) if (solidAt(tx, ty) || (isPlayer && tileAt(tx, ty) === 'H')) hits.push(tx);
    if (hits.length) { if (!isPlayer) { o.y = (ty + 1) * T; o.vy = 0; } return { hits, ty }; }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- scoring & effects ---------- */
function addScore(n, x, y) { G.score += n; if (x !== undefined) pops.push({ x, y, s: String(n), t: 0 }); }
function oneUp(x, y) { G.lives++; sfx.oneup(); pops.push({ x: x ?? P.x, y: y ?? P.y, s: '1UP', t: 0 }); }
function addCoin() { G.coins++; G.score += 200; sfx.coin(); if (G.coins >= 100) { G.coins -= 100; oneUp(); } }
function addBump(tx, ty) { bumps.push({ tx, ty, t: 0 }); }
function bumpOffset(tx, ty) { for (const b of bumps) if (b.tx === tx && b.ty === ty) return -Math.round(Math.sin(b.t / 10 * Math.PI) * 5); return 0; }
function coinPop(tx, ty) { fx.push({ k: 'coin', x: tx * T + 4, y: ty * T - 10, vy: -5, t: 0 }); addCoin(); }
function breakFx(tx, ty) {
  const x = tx * T, y = ty * T;
  for (const [dx, dy, vx, vy] of [[0, 0, -1.2, -5], [8, 0, 1.2, -5], [0, 8, -1, -3], [8, 8, 1, -3]])
    fx.push({ k: 'piece', x: x + dx, y: y + dy, vx, vy, t: 0 });
}
function spawnItem(k, tx, ty) { items.push({ k, x: tx * T + 1, y: ty * T, w: 14, h: 14, vx: 0, vy: 0, emerge: 32 }); sfx.appear(); }
function flipKill(e, dir) { e.st = 'flip'; e.vy = -3.5; e.vx = dir * 0.8; addScore(100, e.x, e.y); sfx.kick(); }
function hitAbove(tx, ty) {
  for (const e of ents) if (e.st === 'walk' && e.x + e.w > tx * T && e.x < tx * T + T && Math.abs(e.y + e.h - ty * T) < 5)
    flipKill(e, P.x + P.w / 2 < e.x + e.w / 2 ? 1 : -1);
  for (const it of items) if (!it.emerge && it.x + it.w > tx * T && it.x < tx * T + T && Math.abs(it.y + it.h - ty * T) < 5) it.vy = -4;
  if (tileAt(tx, ty - 1) === 'o') { L.map[ty - 1][tx] = '.'; coinPop(tx, ty - 1); }
}
function bumpTile(tx, ty) {
  const ch = L.map[ty][tx];
  if (ch === 'B') {
    if (P.big) { L.map[ty][tx] = '.'; breakFx(tx, ty); addScore(50); sfx.brk(); }
    else { addBump(tx, ty); sfx.bump(); }
    hitAbove(tx, ty); return;
  }
  if (ch === 'Q') { coinPop(tx, ty); L.map[ty][tx] = 'U'; }
  else if (ch === 'M') { coinPop(tx, ty); const k = tx + ',' + ty; L.mc[k] = (L.mc[k] || 0) + 1; if (L.mc[k] >= 8) L.map[ty][tx] = 'U'; }
  else if (ch === 'P') { spawnItem('berry', tx, ty); L.map[ty][tx] = 'U'; }
  else if (ch === 'L' || ch === 'H') { spawnItem('clover', tx, ty); L.map[ty][tx] = 'U'; }
  else { sfx.bump(); return; }
  addBump(tx, ty); hitAbove(tx, ty);
}

/* ---------- player ---------- */
function hurt() {
  if (P.inv > 0 || P.dead || P.growT > 0) return;
  if (P.big) { P.big = false; P.y += 8; P.h = 14; P.inv = 120; sfx.hurt(); }
  else killPlayer();
}
function grow() {
  addScore(1000, P.x, P.y);
  if (!P.big) { P.big = true; P.y -= 8; P.h = 22; P.growT = 48; }
  sfx.power();
}
function killPlayer() {
  if (P.dead) return;
  if (P.big) { P.big = false; P.y += 8; P.h = 14; }
  P.dead = true; P.vx = 0; P.vy = 0; G.state = 'dying'; G.t = 0; stopMusic(); sfx.die();
}
function handleHead(h) {
  const p = P;
  if (h.hits.length === 1) { // corner correction: slip past a block edge you barely clipped
    const left = h.hits[0] * T, right = left + T;
    if (p.x + p.w - left <= 4) { p.x = left - p.w; return; }
    if (right - p.x <= 4) { p.x = right; return; }
  }
  p.y = (h.ty + 1) * T; p.vy = 1;
  const c = p.x + p.w / 2; let best = h.hits[0];
  for (const tx of h.hits) if (Math.abs(tx * T + 8 - c) < Math.abs(best * T + 8 - c)) best = tx;
  bumpTile(best, h.ty);
}
function collectCoins() {
  const x1 = Math.floor(P.x / T), x2 = Math.floor((P.x + P.w - 0.01) / T), y1 = Math.floor(P.y / T), y2 = Math.floor((P.y + P.h - 0.01) / T);
  for (let ty = y1; ty <= y2; ty++) for (let tx = x1; tx <= x2; tx++) if (tileAt(tx, ty) === 'o') { L.map[ty][tx] = '.'; addCoin(); }
}
function updatePlayer() {
  const p = P;
  if (p.inv > 0) p.inv--; if (p.growT > 0) p.growT--;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const maxS = keys.run ? 2.6 : 1.5;
  if (dir) {
    p.face = dir;
    const acc = p.onGround ? (Math.sign(p.vx) === -dir ? 0.28 : 0.1) : 0.09;
    p.vx += dir * acc;
    if (Math.abs(p.vx) > maxS) p.vx = Math.sign(p.vx) * Math.max(maxS, Math.abs(p.vx) - 0.06);
  } else if (p.onGround) { p.vx = Math.sign(p.vx) * Math.max(0, Math.abs(p.vx) - 0.1); }
  if (jumpPressed) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  p.coyote = p.onGround ? 6 : Math.max(0, p.coyote - 1);
  if (p.jbuf > 0 && p.coyote > 0) { p.vy = -(5.5 + Math.abs(p.vx) * 0.3); p.jbuf = 0; p.coyote = 0; p.onGround = false; sfx.jump(); }
  p.vy = Math.min(p.vy + ((p.vy < 0 && keys.jump) ? 0.22 : 0.5), 6.5);
  p.x += p.vx;
  if (p.x < camX) { p.x = camX; if (p.vx < 0) p.vx = 0; }
  if (collideX(p)) p.vx = 0;
  p.y += p.vy;
  const head = collideY(p, true);
  if (head) handleHead(head);
  if (p.onGround) p.combo = 0;
  p.anim += Math.abs(p.vx);
  collectCoins();
  if (p.y > H + 8) { killPlayer(); return; }
  if (L.goalX && p.x + p.w >= L.goalX * T + 7 && p.y + p.h <= 12 * T + 1) startClear();
}

/* ---------- enemies & items ---------- */
function stomp(e) {
  e.st = 'squash'; e.t = 0;
  P.vy = keys.jump ? -6.5 : -4; P.y = e.y - P.h;
  const tbl = [100, 200, 400, 800, 1000, 2000, 4000, 8000];
  if (P.combo >= tbl.length) oneUp(e.x, e.y); else addScore(tbl[P.combo], e.x, e.y);
  P.combo++; sfx.stomp();
}
function updateEnts() {
  for (const e of ents) {
    if (e.st === 'idle') { if (e.x < camX + W + 24) e.st = 'walk'; else continue; }
    if (e.st === 'walk') {
      e.t++;
      e.vy = Math.min(e.vy + 0.35, 5);
      e.x += e.vx; if (collideX(e)) e.vx = -e.vx;
      e.y += e.vy; collideY(e, false);
      if (e.y > H + 16 || e.x + e.w < camX - 64) { e.dead = true; continue; }
      if (!P.dead && overlap(P, e)) {
        if (e.type === 'w' && P.vy > 0 && P.y + P.h - e.y < 10) stomp(e);
        else hurt();
      }
    } else if (e.st === 'squash') { if (++e.t > 30) e.dead = true; }
    else if (e.st === 'flip') { e.vy += 0.3; e.x += e.vx; e.y += e.vy; if (e.y > H + 32) e.dead = true; }
  }
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j];
    if (a.st !== 'walk' || b.st !== 'walk' || !overlap(a, b)) continue;
    if (a.x < b.x) { a.vx = -Math.abs(a.vx); b.vx = Math.abs(b.vx); } else { a.vx = Math.abs(a.vx); b.vx = -Math.abs(b.vx); }
  }
  ents = ents.filter(e => !e.dead);
}
function updateItems() {
  for (const it of items) {
    if (it.emerge > 0) { it.y -= 0.5; if (--it.emerge === 0) it.vx = it.k === 'clover' ? 1.2 : 1; continue; }
    it.vy = Math.min(it.vy + 0.3, 5);
    it.x += it.vx; if (collideX(it)) it.vx = -it.vx;
    it.y += it.vy; collideY(it, false);
    if (it.y > H + 20) it.dead = true;
    if (!P.dead && overlap(P, it)) { it.dead = true; if (it.k === 'berry') grow(); else oneUp(it.x, it.y); }
  }
  items = items.filter(i => !i.dead);
}
function updateFx() {
  for (const f of fx) {
    f.t++;
    if (f.k === 'coin') { f.vy += 0.35; f.y += f.vy; if (f.t >= 26) { f.dead = true; pops.push({ x: f.x - 4, y: f.y, s: '200', t: 0 }); } }
    else { f.vy += 0.3; f.x += f.vx; f.y += f.vy; if (f.y > H + 16) f.dead = true; }
  }
  fx = fx.filter(f => !f.dead);
  for (const p of pops) { p.t++; p.y -= 0.6; }
  pops = pops.filter(p => p.t < 45);
  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < 10);
}
function updateCam() { const target = P.x - 136; if (target > camX) camX = Math.min(target, L.w * T - W); }

/* ---------- states ---------- */
function updatePlay() {
  if (++G.tacc >= 25) {
    G.tacc = 0;
    if (G.time > 0) { G.time--; if (G.time === 100) sfx.hurry(); if (G.time === 0) { killPlayer(); return; } }
  }
  updatePlayer(); if (G.state !== 'play') return;
  updateEnts(); updateItems(); updateFx(); updateCam();
}
function updateDying() {
  G.t++;
  if (G.t === 30 && P.y < H) P.vy = -6;
  if (G.t > 30) { P.vy += 0.3; P.y += P.vy; }
  if (G.t > 170) {
    G.lives--;
    if (G.lives <= 0) { G.state = 'over'; G.t = 0; saveHi(); sfx.over(); }
    else startIntro(false);
  }
}
function startClear() {
  G.state = 'clear'; G.phase = 0; G.t = 0; stopMusic(); sfx.flag();
  P.x = L.goalX * T + 8 - P.w; P.vx = 0; P.vy = 0; P.face = 1;
  const y = P.y, b = y < 3 * T ? 5000 : y < 5 * T ? 2000 : y < 7 * T ? 800 : y < 9 * T ? 400 : 100;
  addScore(b, L.goalX * T + 12, P.y);
}
function updateClear() {
  G.t++; updateFx();
  const ground = 12 * T - P.h;
  if (G.phase === 0) {
    P.y = Math.min(P.y + 2, ground);
    G.flagY = Math.min(G.flagY + 2, 11 * T - 2);
    if (P.y >= ground && G.flagY >= 11 * T - 2) { G.phase = 1; G.t = 0; }
  } else if (G.phase === 1) {
    if (G.t === 15) sfx.clear();
    if (G.t > 15) {
      P.vx = 1.2; P.face = 1; P.anim += P.vx;
      P.vy = Math.min(P.vy + 0.5, 6.5);
      P.x += P.vx; collideX(P);
      P.y += P.vy; collideY(P, false);
      updateCam();
      if (P.x >= (L.goalX + 7) * T) { P.hidden = true; G.phase = 2; G.t = 0; }
    }
  } else if (G.phase === 2) {
    if (G.t > 40 && G.time > 0) { const d = Math.min(G.time, 2); G.time -= d; G.score += d * 50; if (G.frame % 4 === 0) sfx.tick(); }
    if (G.t > 40 && G.time === 0) { G.phase = 3; G.t = 0; }
  } else if (G.t > 80) {
    G.stage++;
    if (G.stage >= STAGES.length) { G.state = 'ending'; G.t = 0; saveHi(); sfx.ending(); }
    else startIntro(P.big);
  }
}
function step() {
  G.frame++;
  switch (G.state) {
    case 'title': if (startPressed) newGame(); break;
    case 'intro': if (++G.t > 140) { G.state = 'play'; playMusic(THEMES[L.theme].music); } break;
    case 'play': if (!G.paused) updatePlay(); break;
    case 'dying': updateDying(); break;
    case 'clear': updateClear(); break;
    case 'over': if (++G.t > 240 || (G.t > 60 && startPressed)) { G.state = 'title'; loadStage(0); } break;
    case 'ending': if (++G.t > 90 && startPressed) { G.state = 'title'; loadStage(0); } break;
  }
  jumpPressed = false; startPressed = false;
}

/* ================= RENDER ================= */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
function txt(s, x, y, col = '#fff', size = 8, align = 'left', jp = false) {
  ctx.font = `${size}px ${jp ? '"DotGothic16", sans-serif' : '"Press Start 2P", monospace'}`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const pad = (n, l) => String(n).padStart(l, '0');

function drawBG(cx) {
  const th = THEMES[L.theme];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th.sky); g.addColorStop(1, th.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (L.theme === 'cave') {
    for (let i = -1; i < 4; i++) {
      const x = i * 140 - ((cx * 0.4) % 140);
      ctx.fillStyle = th.hill2;
      ctx.beginPath(); ctx.moveTo(x, 32); ctx.lineTo(x + 20, 90); ctx.lineTo(x + 40, 32); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 70, 32); ctx.lineTo(x + 82, 64); ctx.lineTo(x + 94, 32); ctx.fill();
      ctx.fillStyle = th.hill;
      ctx.beginPath(); ctx.moveTo(x + 30, 208); ctx.lineTo(x + 60, 150); ctx.lineTo(x + 90, 208); ctx.fill();
      R(Math.round(x + 112), 120, 2, 2, '#9fe8ff'); R(Math.round(x + 50), 80, 1, 1, '#9fe8ff');
    }
